<!DOCTYPE html>
<!--
  Variante portrait « écran » d'une diapo nextevents (1080×1920, 9:16) —
  déclinaison de slide_template_portrait.html pour diffusion sur un
  écran 16:9 monté en vertical (totem, affichage dynamique), pas pour
  l'impression. Composition identique, géométrie retaillée pour le
  format plus étroit et plus haut.
  Rempli par nextevents/slide.py via string.Template — mêmes variables
  que le gabarit paysage.
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Oldschool Grotesk';font-weight:400;
 src:url(data:font/woff2;base64,$font_regular) format('woff2')}
@font-face{font-family:'Oldschool Grotesk';font-weight:500;
 src:url(data:font/woff2;base64,$font_medium) format('woff2')}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:'Oldschool Grotesk',Arial,sans-serif;color:$ink;
 background:#000;display:flex;flex-direction:column}
.card{position:relative;flex:1;background:$bg;border-radius:56px;
 overflow:hidden;display:flex;flex-direction:column;padding:42px 44px;
 gap:34px}
.watermark{position:absolute;z-index:0;color:rgba(255,255,255,.35)}
.watermark svg{display:block;width:620px;height:620px}
.watermark--tr{top:-200px;right:-200px}
.watermark--bl{bottom:-200px;left:-200px}
.photo-block{position:relative;flex:0 0 880px}
.photo{position:absolute;inset:0;width:100%;height:100%;
 object-fit:cover;object-position:center 28%;border-radius:40px;
 display:block;background:$dark}
.photo--empty{display:block}
.photo--empty>svg{position:absolute;inset:0;width:100%;height:100%}
.ph-logo{position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center;color:rgba(20,20,20,.75)}
.ph-logo svg{width:52%}
.tag{position:absolute;left:22px;bottom:22px;z-index:2;background:#fff;
 border-radius:2em;padding:11px 30px;font-size:27px;font-weight:500;
 box-shadow:0 10px 34px rgba(20,20,20,.14)}
.credit{position:absolute;right:18px;bottom:18px;z-index:2;font-size:15px;
 line-height:1.3;max-width:320px;text-align:right;color:#fff;
 background:rgba(20,20,20,.45);border-radius:1.2em;padding:5px 13px}
.content{position:relative;flex:1;display:flex;flex-direction:column;
 padding:0 10px;min-height:0}
h1{font-size:70px;font-weight:500;line-height:1.06;letter-spacing:-.01em;
 display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;
 overflow:hidden}
.desc{font-size:32px;line-height:1.45;color:rgba(20,20,20,.78);
 margin-top:30px;display:-webkit-box;-webkit-line-clamp:9;
 -webkit-box-orient:vertical;overflow:hidden}
.specs{margin-top:auto;display:flex;flex-direction:column;gap:18px;
 padding-bottom:64px}
.specs--tight{gap:14px}
.specs--tight .spec{font-size:29px}
.spec{display:flex;align-items:center;gap:15px;font-size:33px;
 font-weight:500}
.spec svg{flex:0 0 auto;width:36px;height:36px}
.attrib{position:absolute;right:34px;bottom:24px;font-size:19px;
 color:rgba(20,20,20,.45);display:flex;align-items:center;gap:11px}
.attrib b{font-size:25px;font-weight:500;color:#efeae6;
 background:#555555;border-radius:2em;padding:9px 24px}
</style></head><body>
<div class="card">
<div class="watermark watermark--tr">$logo_mark</div>
<div class="watermark watermark--bl">$logo_mark</div>
<div class="photo-block">
  $media
  <span class="tag">$tag</span>
</div>
<div class="content">
  <h1 style="font-size:${h1_size}px">$title</h1>
  <p class="desc">$desc</p>
  <div class="$specs_cls">$specs_html</div>
</div>
<div class="attrib">Tout le programme sur <b>lcl.bzh/prog</b></div>
</div>
</body></html>

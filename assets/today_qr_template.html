<!DOCTYPE html>
<!--
  Slide QR « série » (1920×1080) — seconde diapo générée quand la diapo
  du jour appartient à une série (ex. Les grands témoins). Transposition
  sombre du modèle com : fond assorti à la diapo du jour, QR marine sur
  cartouche blanc (lisible par les téléphones), sigle en filigrane.
  Rempli par nextevents/today.py via string.Template — variables :
    $font_regular/$font_medium  fontes Oldschool Grotesk (base64 woff2)
    $bg                         fond (même réglage que la diapo du jour)
    $sentence                   phrase d'appel (série + Mag)
    $qr_data                    QR code en data URI (modules marine)
    $arrow_data                 flèche manuscrite en data URI (extraite du
                                modèle com, recolorée)
    $logo_mark                  logo Champs Libres (SVG, currentColor)
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Oldschool Grotesk';font-weight:400;
 src:url(data:font/woff2;base64,$font_regular) format('woff2')}
@font-face{font-family:'Oldschool Grotesk';font-weight:500;
 src:url(data:font/woff2;base64,$font_medium) format('woff2')}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:'Oldschool Grotesk',Arial,sans-serif;color:#efeae6;
 background:#000;display:flex;flex-direction:column}
.card{position:relative;flex:1;background:$bg;border-radius:72px;
 overflow:hidden;display:flex;align-items:center;justify-content:center}
.watermark{position:absolute;z-index:0;color:rgba(239,234,230,.05)}
.watermark svg{display:block;width:820px;height:820px}
.watermark--tr{top:-260px;right:-260px}
.watermark--bl{bottom:-260px;left:-260px}
.row{position:relative;display:flex;align-items:center;gap:90px}
.qr-text{max-width:640px;font-size:46px;font-weight:500;
 line-height:1.4;color:#a8bce0;text-align:right}
.qr-text b{color:#eef3fb;font-weight:500}
.arrow{flex:0 0 auto;align-self:flex-end;
 margin:0 -75px -60px -145px;width:280px;height:auto}
.qrbox{flex:0 0 auto;background:#fff;border-radius:36px;
 padding:36px;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.qrbox img{display:block;width:400px;height:400px}

</style></head><body>
<div class="card">
  <div class="watermark watermark--tr">$logo_mark</div>
  <div class="watermark watermark--bl">$logo_mark</div>
  <div class="row">
    <div class="qr-text">$sentence</div>
    <img class="arrow" src="$arrow_data" alt="">
    <div class="qrbox"><img src="$qr_data" alt="QR code"></div>
  </div>
</div>
</body></html>

<!DOCTYPE html>
<!--
  ==========================================================================
  Gabarit de diapo « événement » — PORTRAIT A4 (conçu 1240×1754, 1:√2)
  ==========================================================================
  Même charte que slide_template.html, composition verticale : visuel en
  haut (pastille + crédit incrustés), puis titre, description, specs,
  pied de page. Pensée pour l'impression A4 (2480×3508 ≈ 300 dpi en UHD).

  Rempli par nextevents/slide.py via string.Template — mêmes variables
  que le gabarit paysage (voir son commentaire d'en-tête).

  Charte commune : slide_base.css (injecté à la ligne @import
  ci-dessous). Ce gabarit ne contient que ses métriques (:root) et sa
  composition propre (photo-block/content).
-->
<html lang="fr"><head><meta charset="utf-8">
<style>
/* ---------- Métriques portrait A4 1240×1754 ------------------------------ */
:root {
    --w: 1240px;  --h: 1754px;          /* canvas de conception */

    --card-radius: 64px;
    --card-pad: 46px 48px;              /* marges internes de la carte */
    --card-gap: 38px;                   /* visuel ↔ textes */

    --wm-size: 700px;
    --wm-offset: -220px;

    --photo-radius: 44px;
    --photo-pos: center 28%;            /* cadrage légèrement haut */

    --tag-inset: 24px;
    --tag-pad: 12px 34px;
    --tag-size: 30px;

    --credit-inset: 20px;
    --credit-size: 16px;
    --credit-maxw: 340px;
    --credit-pad: 5px 14px;

    --h1-lines: 5;
    --desc-size: 32px;
    --desc-lh: 1.4;
    --desc-mt: 28px;
    --desc-maxw: none;                  /* pleine largeur en portrait */
    --desc-lines: 7;

    --specs-gap: 20px;
    --specs-pad-bottom: 64px;           /* dégage le pied de page absolu */
    --specs-gap-tight: 15px;
    --spec-gap: 16px;
    --spec-size: 36px;
    --spec-size-tight: 31px;
    --spec-icon: 40px;

    --attrib-right: 38px;
    --attrib-bottom: 26px;
    --attrib-size: 21px;
    --attrib-gap: 12px;
    --attrib-b-size: 28px;
    --attrib-b-pad: 10px 26px;
}

@import "slide_base.css";

/* ---------- Composition portrait : visuel au-dessus ----------------------- */

.photo-block { position: relative; flex: 0 0 780px; }

.content {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 14px;
    min-height: 0;
}
</style></head><body>
<div class="card">
<div class="watermark watermark--tr">$logo_mark</div>
<div class="watermark watermark--bl">$logo_mark</div>
<div class="photo-block">
  $media
  <span class="tag">$tag</span>
</div>
<div class="content">
  <h1 style="font-size:${h1_size}px">$title</h1>
  <p class="desc">$desc</p>
  <div class="$specs_cls">$specs_html</div>
</div>
<div class="attrib">Tout le programme sur <b>lcl.bzh/prog</b></div>
</div>
</body></html>

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version de la release (ex: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        run: |
          $tag = "${{ github.ref_name }}"
          if ($env:GITHUB_REF_TYPE -ne "tag") { $tag = "${{ inputs.tag }}" }
          echo "TAG=$tag" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt

      - name: Run smoke tests
        run: python -m unittest discover -s tests

      - name: Generate version files from tag
        # version.txt + nextevents/version.py dérivent du tag — plus de
        # version figée à la main dans les métadonnées de l'exe
        run: python tools/gen_version.py "${{ env.TAG }}"

      - name: Install Chromium headless shell (bundled)
        # BROWSERS_PATH=0 : installe dans playwright/driver/package/
        # .local-browsers -> collecté dans le bundle PyInstaller
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          playwright install chromium --only-shell

      - name: Build with PyInstaller
        run: pyinstaller app.spec --noconfirm

      - name: Package zip
        working-directory: dist
        run: |
          Compress-Archive -Path nextevents -DestinationPath "nextevents-windows-${{ env.TAG }}.zip"
          echo "ZIP_NAME=nextevents-windows-${{ env.TAG }}.zip" >> $env:GITHUB_ENV

      - name: Smoke test artifact
        # l'exe est lancé en --diag : démarre, importe tout le code,
        # teste le navigateur embarqué, écrit data/diag.log — un crash
        # de démarrage (ex: tzdata manquant) fait échouer le build ici
        # plutôt que chez l'utilisateur
        working-directory: dist
        run: |
          Expand-Archive -Path "${{ env.ZIP_NAME }}" -DestinationPath smoke-test
          # exe fenêtré : "&" ne bloque PAS (subsystem GUI détaché) —
          # Start-Process + WaitForExit pour attendre la fin du diag
          $p = Start-Process -FilePath ".\smoke-test\nextevents\nextevents.exe" `
            -ArgumentList "--diag" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--diag a dépassé 120 s" }
          if ($p.ExitCode -ne 0) { throw "l'exe a quitté avec le code $($p.ExitCode)" }
          $log = "smoke-test\nextevents\data\diag.log"
          if (-not (Test-Path $log)) { throw "diag.log absent — l'exe n'a pas démarré" }
          Get-Content $log -Tail 15
          if (-not (Select-String -Path $log -Pattern "launch .* OK")) {
            throw "aucun navigateur ne démarre dans l'exe packagé"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextevents-windows
          path: dist/${{ env.ZIP_NAME }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: dist/${{ env.ZIP_NAME }}
          generate_release_notes: true

  build-linux:
    # ubuntu-22.04 = glibc la plus ancienne supportée : l'AppImage
    # produite tourne sur toute distro avec glibc >= 2.35
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        run: |
          tag="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then tag="${{ inputs.tag }}"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt

      - name: Run smoke tests
        run: python -m unittest discover -s tests

      - name: Generate version files from tag
        run: python tools/gen_version.py "$TAG"

      - name: Install Chromium headless shell (bundled) + libs système
        # install-deps : les libs du headless shell doivent être
        # présentes pour que linuxdeploy les embarque dans l'AppImage
        run: |
          export PLAYWRIGHT_BROWSERS_PATH=0
          playwright install chromium --only-shell
          sudo env "PATH=$PATH" playwright install-deps chromium
          # libs que linuxdeploy doit trouver pour le plugin Qt xcb
          # + libegl1/libxcb-shape0 que le build copie manuellement
          # dans l'AppImage (linuxdeploy les exclut mais Qt6 les exige)
          sudo apt-get update && sudo apt-get install -y \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 \
            libegl1 libxcb-shape0

      - name: Build with PyInstaller
        run: pyinstaller app.spec --noconfirm

      - name: Build AppImage
        run: |
          appimage/build-appimage.sh "$TAG"
          echo "APPIMAGE_NAME=nextevents-linux-$TAG.AppImage" >> "$GITHUB_ENV"

      - name: Smoke test artifact
        # --appimage-extract-and-run : pas besoin de FUSE sur le runner.
        # L'AppImage écrit data/diag.log à côté du fichier .AppImage.
        run: |
          chmod +x "dist/$APPIMAGE_NAME"
          timeout 120 "dist/$APPIMAGE_NAME" --appimage-extract-and-run --diag
          test -f dist/data/diag.log || { echo "diag.log absent"; exit 1; }
          tail -15 dist/data/diag.log
          grep -q "launch .* OK" dist/data/diag.log || {
            echo "aucun navigateur ne démarre dans l'AppImage"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextevents-linux
          path: dist/${{ env.APPIMAGE_NAME }}

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: dist/${{ env.APPIMAGE_NAME }}
